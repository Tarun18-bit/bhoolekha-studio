<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1350" width="1000" height="1350">
  <defs>
    <!-- Parchment texture and aged paper gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf5" />
      <stop offset="40%" stop-color="#f8f2e2" />
      <stop offset="70%" stop-color="#f4ebd4" />
      <stop offset="100%" stop-color="#ebe0c4" />
    </linearGradient>

    <!-- Stamp Ink Filter -->
    <filter id="fadedStamp">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Base Paper with rounded age corners -->
  <rect x="0" y="0" width="1000" height="1350" fill="url(#paperGrad)" />

  <!-- Subtle aging stains and watermarks -->
  <circle cx="850" cy="180" r="120" fill="#e6d5b0" opacity="0.3" filter="blur(30px)" />
  <circle cx="120" cy="1180" r="150" fill="#ded0a8" opacity="0.35" filter="blur(40px)" />
  <path d="M 0,420 Q 500,430 1000,418" stroke="#d6c69e" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" />
  <path d="M 0,890 Q 500,895 1000,885" stroke="#d6c69e" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.4" />

  <!-- Border Box (Double Rule) -->
  <rect x="35" y="35" width="930" height="1280" fill="none" stroke="#685640" stroke-width="3" />
  <rect x="42" y="42" width="916" height="1266" fill="none" stroke="#7e6c52" stroke-width="1" />

  <!-- Header Banner -->
  <text x="500" y="85" text-anchor="middle" font-family="'Noto Serif Devanagari', 'Mangal', serif" font-size="28" font-weight="bold" fill="#3a2e1d">
    उत्तर प्रदेश भू-राजस्व अधिनियम (प्रपत्र सी.एच.-४१)
  </text>
  <text x="500" y="115" text-anchor="middle" font-family="'Noto Serif Devanagari', 'Mangal', serif" font-size="18" fill="#5c4a32">
    ग्राम: रामपुर कलां | परगना व तहसील: पिंडरा | जिला: वाराणसी | चकबंदी अभिलेख
  </text>

  <!-- Official Purple Stamp Seal -->
  <g transform="translate(810, 110) rotate(-12)" filter="url(#fadedStamp)" opacity="0.75">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#2a3f85" stroke-width="3" stroke-dasharray="6 2" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#2a3f85" stroke-width="1.5" />
    <text x="0" y="-22" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a3f85" letter-spacing="1">तहसीलदार कार्यालय</text>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a3f85">सत्यापित प्रति</text>
    <text x="0" y="24" text-anchor="middle" font-size="9" fill="#2a3f85">पिंडरा (वाराणसी)</text>
  </g>

  <!-- Khata & Year Subheader Boxes -->
  <rect x="60" y="150" width="880" height="60" fill="#f5ede0" stroke="#7e6c52" stroke-width="1.5" />
  <line x1="450" y1="150" x2="450" y2="210" stroke="#7e6c52" stroke-width="1.5" />

  <!-- Khata No Box (Matches Bounding Box: x=22%, y=15%, w=14%, h=4.5%) -->
  <text x="80" y="188" font-family="'Noto Serif Devanagari', serif" font-size="19" font-weight="bold" fill="#2e2518">खाता संख्या (Khata No.):</text>
  <text x="290" y="188" font-family="'Mangal', 'Noto Sans Devanagari', sans-serif" font-size="24" font-weight="900" fill="#182352">००१४२ (142)</text>

  <!-- Fasli Year Box (Matches Bounding Box: x=74%, y=15%, w=18%, h=4.5%) -->
  <text x="480" y="188" font-family="'Noto Serif Devanagari', serif" font-size="19" font-weight="bold" fill="#2e2518">फसली वर्ष (Fasli Year):</text>
  <text x="730" y="188" font-family="'Noto Serif Devanagari', serif" font-size="20" font-weight="bold" fill="#182352">१३९१ फसली (1983-84)</text>

  <!-- Section 1: Tenure Holders / Owners Table -->
  <rect x="60" y="240" width="880" height="42" fill="#e9ddcb" stroke="#685640" stroke-width="1.5" />
  <text x="500" y="268" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="18" font-weight="bold" fill="#3a2e1d">
    भाग १ - खातेदार / सह-खातेदार का नाम व अंश विवरण
  </text>

  <rect x="60" y="282" width="880" height="230" fill="none" stroke="#685640" stroke-width="1.5" />
  <line x1="380" y1="282" x2="380" y2="512" stroke="#7e6c52" stroke-width="1" />
  <line x1="680" y1="282" x2="680" y2="512" stroke="#7e6c52" stroke-width="1" />
  <line x1="820" y1="282" x2="820" y2="512" stroke="#7e6c52" stroke-width="1" />

  <!-- Sub-table Headers -->
  <text x="210" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">खातेदार का नाम व निवास</text>
  <text x="530" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">पिता / पति का नाम</text>
  <text x="750" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">अंश / भाग</text>
  <text x="880" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">कैफियत</text>
  <line x1="60" y1="324" x2="940" y2="324" stroke="#7e6c52" stroke-width="1" />

  <!-- Owner 1 Row (Matches Bounding Box: x=12%, y=31%, w=28%, h=5%) -->
  <text x="80" y="365" font-family="'Mangal', cursive, serif" font-size="20" font-weight="bold" fill="#1b2447">
    १. रामेश्वर प्रसाद चौबे
  </text>
  <text x="400" y="365" font-family="'Mangal', serif" font-size="18" fill="#2d3345">
    स्व. बृजमोहन चौबे
  </text>
  <text x="740" y="365" font-family="'Mangal', serif" font-size="19" font-weight="bold" fill="#182352">
    १/२ (अधा भाग)
  </text>
  <text x="840" y="365" font-size="14" fill="#66533c">संक्रमणीय भूमिधर</text>

  <line x1="60" y1="395" x2="940" y2="395" stroke="#9c876d" stroke-width="0.75" stroke-dasharray="2 3" />

  <!-- Owner 2 Row (Faded Ink - Amber flag! Matches Bounding Box: x=12%, y=38%, w=28%, h=5.5%) -->
  <text x="80" y="440" font-family="'Mangal', cursive, serif" font-size="20" font-weight="bold" fill="#4f5978" opacity="0.82">
    २. देवेन्द्र नाथ चौबे
  </text>
  <text x="400" y="440" font-family="'Mangal', serif" font-size="18" fill="#5a6278" opacity="0.85">
    स्व. बृजमोहन चौबे
  </text>
  <text x="740" y="440" font-family="'Mangal', serif" font-size="19" font-weight="bold" fill="#4f5978">
    १/२ (अधा भाग)
  </text>
  <text x="840" y="440" font-size="14" fill="#66533c">संक्रमणीय भूमिधर</text>

  <!-- Section 2: Khasra Parcel breakdown -->
  <rect x="60" y="540" width="880" height="42" fill="#e9ddcb" stroke="#685640" stroke-width="1.5" />
  <text x="500" y="568" text-anchor="middle" font-family="'Noto Serif Devanagari', serif" font-size="18" font-weight="bold" fill="#3a2e1d">
    भाग २ - भूखण्ड (खसरा संख्यावार) क्षेत्रफल एवं मालगुजारी विवरण
  </text>

  <rect x="60" y="582" width="880" height="290" fill="none" stroke="#685640" stroke-width="1.5" />
  <line x1="220" y1="582" x2="220" y2="872" stroke="#7e6c52" stroke-width="1" />
  <line x1="480" y1="582" x2="480" y2="872" stroke="#7e6c52" stroke-width="1" />
  <line x1="740" y1="582" x2="740" y2="872" stroke="#7e6c52" stroke-width="1" />

  <!-- Column Headers -->
  <text x="140" y="612" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">खसरा संख्या (Plot No.)</text>
  <text x="350" y="612" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">क्षेत्रफल (बीघा - बिस्वा)</text>
  <text x="610" y="612" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">भूमि वर्गीकरण (किस्म)</text>
  <text x="840" y="612" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a3b27">निर्धारित लगान (रु.)</text>
  <line x1="60" y1="626" x2="940" y2="626" stroke="#7e6c52" stroke-width="1" />

  <!-- Plot 1 Row: 482/1 -->
  <text x="100" y="670" font-family="'Mangal', serif" font-size="21" font-weight="bold" fill="#1b2447">४८२/१ (482/1)</text>
  <text x="280" y="670" font-family="'Mangal', serif" font-size="20" font-weight="bold" fill="#1b2447">१ बीघा १८ बिस्वा</text>
  <text x="510" y="670" font-family="'Mangal', serif" font-size="17" fill="#2d3345">चाही (नलकूप सिंचित)</text>
  <text x="810" y="670" font-family="'Mangal', serif" font-size="18" font-weight="bold" fill="#1b2447">१४.५० रु.</text>

  <line x1="60" y1="700" x2="940" y2="700" stroke="#9c876d" stroke-width="0.75" />

  <!-- Plot 2 Row: 482/2 -->
  <text x="100" y="745" font-family="'Mangal', serif" font-size="21" font-weight="bold" fill="#1b2447">४८२/२ (482/2)</text>
  <text x="280" y="745" font-family="'Mangal', serif" font-size="20" font-weight="bold" fill="#1b2447">१ बीघा १६ बिस्वा</text>
  <text x="510" y="745" font-family="'Mangal', serif" font-size="17" fill="#2d3345">बारानी (एकफसली)</text>
  <text x="810" y="745" font-family="'Mangal', serif" font-size="18" font-weight="bold" fill="#1b2447">११.२० रु.</text>

  <line x1="60" y1="775" x2="940" y2="775" stroke="#9c876d" stroke-width="0.75" />

  <!-- Total Summary Row in Document: 3 Bigha 8 Biswa (Visual Discrepancy!) -->
  <rect x="60" y="790" width="880" height="60" fill="#fcf6ec" stroke="#914d1b" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="80" y="828" font-family="'Noto Serif Devanagari', serif" font-size="18" font-weight="bold" fill="#80350d">
    कुल दर्ज क्षेत्रफल (Total Stated Area in Register):
  </text>
  <text x="560" y="828" font-family="'Mangal', serif" font-size="22" font-weight="900" fill="#9c2716">
    ३ बीघा ८ बिस्वा (०.८६०० हे.)
  </text>

  <!-- Revenue Official Signatures & Seal at Bottom -->
  <g transform="translate(100, 960)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#4a3b27">हस्ताक्षर लेखपाल / पटवारी</text>
    <path d="M 0,25 Q 40,-5 80,30 T 160,10" stroke="#182352" stroke-width="2" fill="none" opacity="0.8" />
    <text x="0" y="55" font-size="12" fill="#685640">हल्का संख्या १२, दिनांक: २२/१०/१९८४</text>
  </g>

  <g transform="translate(680, 960)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#4a3b27">हस्ताक्षर नायब तहसीलदार / कानूनगो</text>
    <path d="M 10,30 Q 60,0 120,35 T 200,15" stroke="#182352" stroke-width="2" fill="none" opacity="0.8" />
    <text x="0" y="55" font-size="12" fill="#685640">तहसील पिंडरा, जिला वाराणसी</text>
  </g>

  <!-- Legal Watermark Note at very bottom -->
  <text x="500" y="1260" text-anchor="middle" font-size="13" fill="#8c785c" font-style="italic">
    [डिजिटलीकरण हेतु सहायक प्रति | किसी भी कानूनी विवाद अथवा मालिकाना हक के निर्णय के लिए मूल राजस्व खतौनी एवं बंदोबस्त अभिलेखागार से मिलान अनिवार्य है]
  </text>
</svg>
